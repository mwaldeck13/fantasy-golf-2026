        <tr>
          <td class="wk">W${p.week}</td>
          <td class="golfer" style="color:var(--text-dim)">🔒 Pick hidden until deadline</td>
          <td class="pay zero">—</td>
        </tr>` : `
        <tr>
          <td class="wk">W${p.week}</td>
          <td class="golfer">${escape(p.golfer)}${p.isWinner ? '<span class="badge gold">WIN</span>' : ""} <span style="color:var(--text-dim);font-size:11px">(${escape(p.finish || "—")})</span></td>
          <td class="pay${p.payout ? "" : " zero"}">${p.payout ? fmtMoney(p.payout) : "—"}</td>
        </tr>`).join("")}</table>`;
      card.appendChild(det);
    }
  });
  main.appendChild(card);
}

// ---------- Weekly Picks ----------
function renderPicks(main) {
  const { weeks } = STATE.data;
  const playedWeeks = weeks.filter(w => Object.values(w.picks).some(p => p));
  if (!playedWeeks.length) {
    main.innerHTML = `<div class="card"><div class="empty">No picks recorded yet.</div></div>`;
    return;
  }
  const wkIdx = playedWeeks.findIndex(w => w.week === STATE.pickWeek);
  const idx = wkIdx >= 0 ? wkIdx : playedWeeks.length - 1;
  const wk = playedWeeks[idx];

  const bar = document.createElement("div");
  bar.className = "week-bar";
  bar.innerHTML = `
    <button class="nav-btn" id="prevWk" ${idx === 0 ? "disabled" : ""}>‹</button>
    <select id="weekSel">${playedWeeks.map(w => `<option value="${w.week}" ${w.week === wk.week ? "selected" : ""}>W${w.week} · ${escape(w.event)}</option>`).join("")}</select>
    <button class="nav-btn" id="nextWk" ${idx === playedWeeks.length - 1 ? "disabled" : ""}>›</button>
  `;
  main.appendChild(bar);
  bar.querySelector("#weekSel").addEventListener("change", e => {
    STATE.pickWeek = parseInt(e.target.value, 10);
    render();
  });
  bar.querySelector("#prevWk").addEventListener("click", () => {
    if (idx > 0) { STATE.pickWeek = playedWeeks[idx - 1].week; render(); }
  });
  bar.querySelector("#nextWk").addEventListener("click", () => {
    if (idx < playedWeeks.length - 1) { STATE.pickWeek = playedWeeks[idx + 1].week; render(); }
  });

  const card = document.createElement("div");
  card.className = "card";
  const hidden = isWeekHidden(wk.week, STATE.data);
  const sched = STATE.data.schedule && STATE.data.schedule[wk.week];
  const deadline = sched && sched.deadline;
  const winner = tournamentWinner(wk);
  const liveWeek = getLiveWeek(STATE.data);
  const isLive = !hidden && liveWeek === wk.week && STATE.data.live && !STATE.data.live.completed;
  const finalUnsynced = liveWeek === wk.week && STATE.data.live && STATE.data.live.completed;
  const liveByName = (STATE.data.live && STATE.data.live.byName) || {};
  const titleSuffix = hidden
    ? ` · <span class="chip">🔒 Picks hidden until ${escape(fmtDeadline(deadline))}</span>`
    : winner
    ? ` · Winner: <strong>${escape(winner.golfer)}</strong>`
    : (isLive ? ` · <span class="live-pill">LIVE</span>` : "");
  card.innerHTML = `<div class="week-title">Week ${wk.week} · <strong>${escape(wk.event)}</strong>${titleSuffix}</div>`;
  // Sort: paid > live (lower position = better) > unpaid > unpicked
  const livePosNum = name => {
    const k = (name || "").toLowerCase();
    const e = liveByName[k];
    if (!e) return Infinity;
    const m = (e.position || "").match(/(\d+)/);
    return m ? parseInt(m[1], 10) : Infinity;
  };
  // Before the deadline everything's $0/hidden, so keep the plain participant order
  // and don't sort by golfer (which would leak nothing but adds no value).
  const order = hidden
    ? STATE.data.participants.map(name => ({ name, pick: wk.picks[name] }))
    : STATE.data.participants
      .map(name => ({ name, pick: wk.picks[name] }))
      .sort((a, b) => {
        const ap = (a.pick && a.pick.payout) || 0, bp = (b.pick && b.pick.payout) || 0;
        if (bp !== ap) return bp - ap;
        // Tie on payout: when nobody's been paid yet, sort by live position (lower is better)
        const al = a.pick ? livePosNum(a.pick.golfer) : Infinity;
        const bl = b.pick ? livePosNum(b.pick.golfer) : Infinity;
        return al - bl;
      });
  for (const { name, pick } of order) {
    const row = document.createElement("div");
    row.className = "pick-row" + (!hidden && pick && pick.finish === "1" ? " winner" : "");
    if (hidden) {
      row.innerHTML = pick
        ? `<div><div class="who">${escape(name)}</div><div><span class="chip live">✓ Picked</span></div></div><div class="pay zero" title="Hidden until the deadline">🔒</div>`
        : `<div><div class="who">${escape(name)}</div><div class="golfer" style="color:var(--text-dim)">No pick yet</div></div><div class="pay zero">—</div>`;
    } else if (!pick) {
      row.innerHTML = `<div><div class="who">${escape(name)}</div><div class="golfer" style="color:var(--text-dim)">No pick</div></div><div class="pay zero">—</div>`;
    } else {
      const live = liveByName[(pick.golfer || "").toLowerCase()];
      // Right-side cell logic:
      //   If we have a real payout: show payout (final state).
      //   Else if live data has the golfer: show "<score> <position>".
      //   Else: "—".
      let rightCell;
      if (pick.payout) {
        rightCell = `<div class="pay">${fmtMoney(pick.payout)}</div>`;
      } else if (live) {
        const scoreText = live.score || "—";
        const posText = live.position ? ` <span class="live-pos">${escape(live.position)}</span>` : "";
        const liveBadge = isLive ? "" : (finalUnsynced ? '<span class="live-badge">FINAL</span>' : '<span class="live-badge">LIVE</span>');
        rightCell = `<div class="live-score">${escape(scoreText)}${posText}${liveBadge}</div>`;
      } else {
        rightCell = `<div class="pay zero">—</div>`;
      }
      row.innerHTML = `
        <div>
          <div class="who">${escape(name)}</div>
          <div><span class="golfer">${escape(pick.golfer)}</span><span class="finish">(${escape(pick.finish || "—")})</span></div>
        </div>
        ${rightCell}
      `;
    }
    card.appendChild(row);
  }
  main.appendChild(card);
}

// ---------- Schedule ----------
function renderSchedule(main) {
  const { weeks } = STATE.data;
  const byWeek = {};
  for (const w of weeks) byWeek[w.week] = w;
  const card = document.createElement("div");
  card.className = "card";
  for (let n = 1; n <= CONFIG.TOTAL_WEEKS; n++) {
    const w = byWeek[n];
    if (!w) continue;
    const winner = tournamentWinner(w);
    const hasPicks = Object.values(w.picks).some(p => p);
    const row = document.createElement("div");
    row.className = "sched-row" + (hasPicks ? "" : " future");
    row.innerHTML = `
      <div class="wk">W${w.week}</div>
      <div>
        <div class="ev">${escape(w.event)}</div>
        ${winner ? `<div class="winner">Won by <b>${escape(winner.golfer)}</b> · picked by ${winner.pickedBy.map(escape).join(", ")}</div>` : (hasPicks ? `<div class="winner">No participant picked the winner</div>` : `<div class="winner">—</div>`)}
      </div>
    `;
    card.appendChild(row);
  }
  main.appendChild(card);
}

// ---------- Outlook (end-of-season projections) ----------
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function renderOutlook(main) {
  const o = computeOutlook(STATE.data);

  if (o.M === 0 || o.R === 0) {
    main.innerHTML = `<div class="card"><div class="empty">
      No projected payouts yet. On the <b>Schedule</b> tab, add finishing-position payout
      columns to the right of <b>Deadline</b> for the closing tournaments — header cells
      <b>1, 2, 3…</b> (the place) and body cells the prize money (e.g. <b>$3,600,000</b>).
      The <b>1st</b> column is what powers these projections.
    </div></div>`;
    return;
  }

  // Union of positions present across remaining weeks, capped so the table stays mobile-friendly.
  const positions = Array.from(new Set(o.remaining.flatMap(r => Object.keys(r.payouts).map(Number))))
    .sort((a, b) => a - b).slice(0, 4);

  // ---- Remaining purses ----
  const purse = document.createElement("div");
  purse.className = "card";
  purse.innerHTML = `
    <div class="week-title">Still on the table · <strong>${fmtMoney(o.R)}</strong> in winner money over ${o.M} event${o.M === 1 ? "" : "s"}</div>
    <div class="outlook-wrap"><table class="outlook-table">
      <thead><tr><th>Wk</th><th>Event</th>${positions.map(p => `<th class="num">${ordinal(p)}</th>`).join("")}</tr></thead>
      <tbody>${o.remaining.map(r => `
        <tr>
          <td class="wk">W${r.week}</td>
          <td>${escape(r.event)}</td>
          ${positions.map(p => `<td class="num">${r.payouts[p] ? fmtMoneyShort(r.payouts[p]) : "—"}</td>`).join("")}
        </tr>`).join("")}
      </tbody>
    </table></div>`;
  main.appendChild(purse);

  // ---- The chase (one consolidated table + a dynamic one-liner) ----
  const chip = p => {
    if (p.clinchedTitle) return `<span class="chip gold">🏆 Clinched</span>`;
    if (!p.isLeader && !p.canWin) return `<span class="chip">Out of 1st</span>`;
    return "";   // no chip for the ordinary "still alive" case — keeps the table clean
  };
  const chase = document.createElement("div");
  chase.className = "card";
  chase.innerHTML = `
    <div class="week-title">The chase</div>
    <div class="outlook-wrap"><table class="outlook-table">
      <thead><tr><th>#</th><th>Player</th><th class="num">Total</th><th class="num">Back</th><th class="num">Max</th><th></th></tr></thead>
      <tbody>${o.players.map(p => `
        <tr>
          <td class="wk">${p.rank}</td>
          <td>${escape(p.name)}</td>
          <td class="num">${fmtMoneyShort(p.current)}</td>
          <td class="num">${p.isLeader ? "—" : fmtMoneyShort(p.gapToLead)}</td>
          <td class="num">${fmtMoneyShort(p.ceiling)}</td>
          <td>${chip(p)}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>`;
  main.appendChild(chase);
}

// ---------- Rosters & Reuse ----------
function renderRosters(main) {
  const { ranked } = computeStandings(STATE.data);
  for (const s of ranked) {
    const card = document.createElement("div");
    card.className = "card roster-card";
    const sortedPicks = [...s.picks].sort((a, b) => a.week - b.week);
    const golferFirstWeek = {};
    for (const p of sortedPicks) {
      if (golferFirstWeek[p.golfer] == null) golferFirstWeek[p.golfer] = p.week;
    }
    const items = sortedPicks.map(p => {
      if (isWeekHidden(p.week, STATE.data)) {
        // Don't reveal the golfer (or a Reusable/Locked tag that could hint) until the deadline.
        return `
          <div class="wk">W${p.week}</div>
          <div class="gf" style="color:var(--text-dim)">🔒 Hidden until deadline</div>
          <div class="fn"></div>
          <div><span class="tag">Picked</span></div>
        `;
      }
      let tag = "";
      if (p.isWinner) tag = `<span class="tag winner">Winner</span>`;
      else {
        // Reusable iff first appearance was on/before latestWinnerWeek and there are credits left
        const eligible = golferFirstWeek[p.golfer] <= s.latestWinnerWeek;
        const hasCredits = s.creditsRemaining > 0;
        const reusable = eligible && hasCredits && s.latestWinnerWeek > 0;
        tag = reusable
          ? `<span class="tag reusable">Reusable</span>`
          : `<span class="tag locked">Locked</span>`;
      }
      return `
        <div class="wk">W${p.week}</div>
        <div class="gf">${escape(p.golfer)}</div>
        <div class="fn">${escape(p.finish || "—")}${p.payout ? " · " + fmtMoney(p.payout) : ""}</div>
        <div>${tag}</div>
      `;
    }).join("");
    card.innerHTML = `
      <div class="roster-head">
        <div class="nm">${escape(s.name)}</div>
        <div class="sm">${fmtMoney(s.total)}</div>
      </div>
      <div class="roster-summary">
        <span><b>${s.picks.length}</b> picks</span>
        <span><b>${s.winners}</b> winner${s.winners === 1 ? "" : "s"}</span>
        <span><b>${s.creditsRemaining}</b> credit${s.creditsRemaining === 1 ? "" : "s"} remaining</span>
        <span><b>${s.reusesSpent}</b> reuse${s.reusesSpent === 1 ? "" : "s"} spent</span>
        ${s.avgPosition != null ? `<span><b>${s.avgPosition.toFixed(1)}${s.posMissingCut ? "*" : ""}</b> average finish</span>` : ""}
      </div>
      <div class="roster-list">${items || `<div class="empty" style="grid-column:1/-1">No picks yet.</div>`}</div>
    `;
    main.appendChild(card);
  }
}

// ---------- My Pick ----------
function openWeeks(data) {
  // Weeks where there's a deadline in the future
  const now = new Date();
  const out = [];
  for (let n = 1; n <= CONFIG.TOTAL_WEEKS; n++) {
    const s = data.schedule && data.schedule[n];
    if (s && s.deadline && s.deadline > now) {
      const wk = data.weeks.find(w => w.week === n);
      out.push({ week: n, event: s.event || (wk && wk.event) || `Week ${n}`, deadline: s.deadline });
    }
  }
  return out;
}

function golferSuggestions(data, week) {
  // Show only this week's field (sorted) — that's who's actually playing. If ESPN
  // hasn't posted the field yet, fall back to historical picks so the box isn't
  // empty; the soft-warn still flags anyone not in the (as-yet-unposted) field.
  const fieldList = (week != null && data.field && data.field[week] && data.field[week].length)
    ? data.field[week].slice().sort()
    : null;
  if (fieldList) return fieldList;
  const seen = new Set();
  const history = [];
  for (const w of data.weeks) {
    for (const p of Object.values(w.picks)) {
      if (!p || !p.golfer) continue;
      const k = p.golfer.toLowerCase();
      if (seen.has(k)) continue;
      seen.add(k);
      history.push(p.golfer);
    }
  }
  history.sort();
  return history;
}

// Filter a golfer list against a query. Prefix matches first, then substring,
// up to 30 results. Empty query returns the first 30 names as-is.
function filterGolfers(query, list) {
  if (!list || !list.length) return [];
  if (!query) return list; // empty query = full scrollable list
  const q = query.toLowerCase();
  const prefix = [];
  const substring = [];
  for (const g of list) {
    const lg = g.toLowerCase();
    if (lg.startsWith(q)) prefix.push(g);
    else if (lg.includes(q)) substring.push(g);
  }
  return prefix.concat(substring).slice(0, 50);
}

// Render the dropdown rows for a given query + suggestion list. Highlights
// the matched substring in each row so the user sees why each one matched.
function renderACDropdown(host, query, suggestions) {
  const matches = filterGolfers(query, suggestions);
  if (!matches.length) {
    host.innerHTML = `<div class="ac-empty">${query ? "No matches" : "No suggestions yet"}</div>`;
    return;
  }
  const q = (query || "").toLowerCase();
  host.innerHTML = matches.map(g => {
    let display = escape(g);
    if (q) {
      const lg = g.toLowerCase();
      const i = lg.indexOf(q);
      if (i >= 0) {
        display = escape(g.slice(0, i)) + `<span class="match">${escape(g.slice(i, i + q.length))}</span>` + escape(g.slice(i + q.length));
      }
    }
    return `<button type="button" class="ac-row" data-golfer="${escape(g)}">${display}</button>`;
  }).join("");
}

// Returns null if no field is published for this week, or the golfer is in it.
// Otherwise returns a short reason string for the soft-warn callout.
function fieldSoftWarn(data, week, golfer, eventName) {
  golfer = (golfer || "").trim();
  if (!golfer) return null;
  const field = data.field && data.field[week];
  if (!field || !field.length) return null;
  const lower = golfer.toLowerCase();
  // Try forgiving match: case-insensitive, fall back to last-name suffix match
  const exact = field.some(g => g.toLowerCase() === lower);
  if (exact) return null;
  const fuzzy = field.some(g => {
    const a = g.toLowerCase().replace(/[^a-z]/g, "");
    const b = lower.replace(/[^a-z]/g, "");
    return a === b;
  });
  if (fuzzy) return null;
  const suffix = eventName ? ` ${eventName}` : "";
  return `${golfer} isn't in the${suffix} field — double-check before submitting.`;
}

function fmtDeadline(d) {
  if (!d) return "—";
  return d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function renderMyPick(main) {
  const data = STATE.data;
  const F = STATE.form;
  const open = openWeeks(data);
  if (F.week == null && open.length) F.week = open[0].week;

  // Last submit confirmation banner
  if (STATE.formStatus) {
    const b = document.createElement("div");
    b.className = STATE.formStatus.type === "ok" ? "success-banner" : "toast";
    b.textContent = STATE.formStatus.message;
    main.appendChild(b);
  }

  if (open.length === 0) {
    main.innerHTML += `<div class="card"><div class="empty">No weeks open for picks. The admin sets per-week deadlines in the Schedule tab of the spreadsheet.</div></div>`;
    return;
  }

  // Live validation against current form values
  const validation = canPick(F.name, F.week, F.golfer, data);
  const formStats = (F.name && data.schedule)
    ? (() => {
        const s = computeStandings(data).stats[F.name];
        return s ? { total: s.total, winners: s.winners, credits: s.creditsRemaining } : null;
      })()
    : null;
  const wkInfo = open.find(w => w.week === F.week) || open[0];
  const existing = (F.name && data) ? (computeStandings(data).stats[F.name]?.picks.find(p => p.week === F.week)) : null;

  const card = document.createElement("div");
  card.className = "card form-card";
  card.innerHTML = `
    <h2>Submit your pick</h2>
    ${formStats ? `<div class="status-panel">
      <div class="row"><span>Earnings</span><b>${fmtMoney(formStats.total)}</b></div>
      <div class="row"><span>Winners picked</span><b>${formStats.winners}</b></div>
      <div class="row"><span>Reuse credits remaining</span><b>${formStats.credits}</b></div>
      <div class="verdict ${F.golfer ? (validation.ok ? "ok" : "err") : "idle"}">
        ${F.golfer ? (validation.ok ? "✓ " + (validation.info || "Pick is allowed.") : "✕ " + validation.error) : "Type a golfer to check."}
      </div>
    </div>` : ""}

    <div class="field">
      <label for="pickName">Your name</label>
      <select id="pickName">
        <option value="">— Select —</option>
        ${data.participants.map(n => `<option value="${escape(n)}" ${n === F.name ? "selected" : ""}>${escape(n)}</option>`).join("")}
      </select>
    </div>

    <div class="field">
      <label for="pickPin">PIN</label>
      <input id="pickPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" value="${escape(F.pin)}" placeholder="••••" />
    </div>

    <div class="field">
      <label for="pickWeek">Week</label>
      <select id="pickWeek">
        ${open.map(w => `<option value="${w.week}" ${w.week === F.week ? "selected" : ""}>Week ${w.week} · ${escape(w.event)}</option>`).join("")}
      </select>
      <div class="hint">Deadline: ${fmtDeadline(wkInfo.deadline)}</div>
    </div>

    <div class="field">
      <label for="pickGolfer">Golfer</label>
      <div class="ac-wrap">
        <input id="pickGolfer" type="text" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false"
               value="${escape(F.golfer)}" placeholder="e.g. Scottie Scheffler" />
        <div class="ac-dropdown" id="pickGolferAC" hidden></div>
      </div>
      <div class="warn" id="pickFieldWarn" hidden></div>
      ${existing ? (isWeekHidden(F.week, data)
          ? `<div class="hint">A pick is already in for this week — submitting will replace it. (Hidden until the deadline.)</div>`
          : `<div class="hint">Currently picked: <b>${escape(existing.golfer)}</b> — submitting will replace this.</div>`) : ""}
    </div>

    <button class="submit-btn" id="pickSubmit" ${(!F.name || !F.pin || !F.golfer || !validation.ok || STATE.submitting) ? "disabled" : ""}>
      ${STATE.submitting ? "Submitting…" : (existing ? "Update pick" : "Submit pick")}
    </button>
  `;
  main.appendChild(card);

  // Wire input events without re-rendering on every keystroke (would lose focus).
  // We re-render on blur/change for selects + on debounced input for golfer.
  const $name = card.querySelector("#pickName");
  const $pin = card.querySelector("#pickPin");
  const $week = card.querySelector("#pickWeek");
  const $golfer = card.querySelector("#pickGolfer");
  const $btn = card.querySelector("#pickSubmit");

  // Surgical updates: do NOT re-render the form for input events — that destroys
  // the focused input and Safari restores focus to a different field.
  function refreshLive() {
    const v = canPick(F.name, F.week, F.golfer, data);
    const verdict = card.querySelector(".verdict");
    if (verdict) {
      verdict.classList.remove("ok", "err", "idle");
      if (!F.golfer) {
        verdict.classList.add("idle");
        verdict.textContent = "Type a golfer to check.";
      } else if (v.ok) {
        verdict.classList.add("ok");
        verdict.textContent = "✓ " + (v.info || "Pick is allowed.");
      } else {
        verdict.classList.add("err");
        verdict.textContent = "✕ " + v.error;
      }
    }
    // Field soft-warn (independent of canPick verdict; only when reuse rules pass)
    const warn = card.querySelector("#pickFieldWarn");
    if (warn) {
      const eventName = (data.schedule && data.schedule[F.week] && data.schedule[F.week].event) || "";
      const msg = fieldSoftWarn(data, F.week, F.golfer, eventName);
      if (msg && v.ok) {
        warn.textContent = "⚠ " + msg;
        warn.hidden = false;
      } else {
        warn.hidden = true;
      }
    }
    $btn.disabled = !F.name || !F.pin || !F.golfer || !v.ok || STATE.submitting;
    $btn.textContent = STATE.submitting ? "Submitting…" : (v.isEdit ? "Update pick" : "Submit pick");
  }
  // Run once on render so warn is correct for any pre-filled value.
  refreshLive();

  // Name and week changes refresh enough other panels (stats, deadline) that a
  // re-render is fine — these are <select>s, so they fire once per selection
  // (not per keystroke) and the user doesn't lose focus mid-typing.
  $name.addEventListener("change", () => {
    F.name = $name.value;
    if (F.name) localStorage.setItem("fg_name", F.name);
    STATE.formStatus = null;
    render();
  });
  $week.addEventListener("change", () => { F.week = parseInt($week.value, 10); STATE.formStatus = null; render(); });

  // Pin and golfer update in place — no re-render, no focus loss.
  $pin.addEventListener("input", () => { F.pin = $pin.value; refreshLive(); });

  // -------- Custom golfer autocomplete --------
  const $ac = card.querySelector("#pickGolferAC");
  const suggestions = golferSuggestions(data, F.week);

  function showAC(query) {
    renderACDropdown($ac, query, suggestions);
    $ac.hidden = false;
  }
  function hideAC() { $ac.hidden = true; }

  $golfer.addEventListener("input", () => {
    F.golfer = $golfer.value;
    showAC(F.golfer);
    refreshLive();
  });
  $golfer.addEventListener("focus", () => {
    showAC($golfer.value);
    // Scroll the input toward the top so the dropdown has room above the keyboard.
    // Tiny delay lets the keyboard begin animating in first.
    setTimeout(() => {
      try { $golfer.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e) {}
    }, 150);
  });
  // Use mousedown (fires before blur) so we don't lose the click target.
  $ac.addEventListener("mousedown", (ev) => {
    const btn = ev.target.closest(".ac-row");
    if (!btn) return;
    ev.preventDefault();
    const picked = btn.dataset.golfer;
    F.golfer = picked;
    $golfer.value = picked;
    hideAC();
    refreshLive();
  });
  // Hide dropdown when focus leaves the input *and* the dropdown.
  // Small delay so a tap on a row registers before hide.
  $golfer.addEventListener("blur", () => setTimeout(hideAC, 150));
  // Tap outside the wrap also hides.
  document.addEventListener("click", (ev) => {
    if (!card.contains(ev.target)) hideAC();
  });

  $btn.addEventListener("click", () => submitPick());
}

async function submitPick() {
  const F = STATE.form;
  const v = canPick(F.name, F.week, F.golfer, STATE.data);
  if (!v.ok) {
    STATE.formStatus = { type: "err", message: v.error };
    render();
    return;
  }
  if (!CONFIG.SUBMIT_URL) {
    STATE.formStatus = { type: "err", message: "SUBMIT_URL is not configured." };
    render();
    return;
  }
  STATE.submitting = true;
  STATE.formStatus = null;
  render();
  try {
    // text/plain body sidesteps CORS preflight on Apps Script Web Apps
    const res = await fetch(CONFIG.SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        participant: F.name,
        pin: F.pin,
        week: F.week,
        golfer: F.golfer.trim()
      }),
      redirect: "follow"
    });
    const json = await res.json();
    STATE.submitting = false;
    if (json.ok) {
      STATE.formStatus = { type: "ok", message: json.message || "Pick saved." };
      F.golfer = "";
      F.pin = "";
      render();
      // Re-fetch the league data so the new pick shows up across tabs
      loadData();
    } else {
      STATE.formStatus = { type: "err", message: json.error || "Submission rejected." };
      render();
    }
  } catch (err) {
    STATE.submitting = false;
    STATE.formStatus = { type: "err", message: "Submit failed: " + err.message };
    render();
  }
}

// ============================================================================
// EVENTS
// ============================================================================
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    STATE.tab = btn.dataset.tab;
    STATE.expandedRow = null;
    render();
  });
});
$("#refreshBtn").addEventListener("click", loadData);

// Update the "Updated Xm ago" text every minute without re-rendering
setInterval(() => {
  if (STATE.lastUpdated) {
    $("#updated").textContent = fmtRelative(STATE.lastUpdated);
  }
}, 30000);

// Re-render the leaderboard chart on resize so it re-flows to the new width.
let resizeTimer = null;
window.addEventListener("resize", () => {
  if (STATE.tab !== "leaderboard" || !STATE.data) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(), 150);
});

// Re-fetch when tab becomes visible again (handles users returning to the app)
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && STATE.lastUpdated) {
    const ageMin = (Date.now() - STATE.lastUpdated.getTime()) / 60000;
    if (ageMin > 5) loadData();
  }
});

loadData();
</script>
</body>
</html>
