<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#125c40"/>
      <stop offset="1" stop-color="#08301f"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.36" cy="0.30" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#eef2ee"/>
      <stop offset="1" stop-color="#c4cfc7"/>
    </radialGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#e8cb7c"/>
      <stop offset="1" stop-color="#c49a3f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- ground shadow under the ball -->
  <ellipse cx="308" cy="400" rx="100" ry="22" fill="#04170e" opacity="0.32"/>
  <!-- flagstick (left) -->
  <circle cx="166" cy="116" r="11" fill="#eef2ee"/>
  <rect x="160" y="116" width="12" height="272" rx="6" fill="#eef2ee"/>
  <!-- pennant pointing right -->
  <path d="M172 128 L286 160 L172 192 Z" fill="url(#flag)"/>
  <!-- golf ball (right) -->
  <circle cx="308" cy="306" r="102" fill="url(#ball)"/>
  <!-- dimples -->
  <g fill="#a9b7af" opacity="0.55">
    <circle cx="308" cy="270" r="8"/>
    <circle cx="286" cy="292" r="8"/><circle cx="330" cy="292" r="8"/>
    <circle cx="264" cy="314" r="8"/><circle cx="308" cy="314" r="8"/><circle cx="352" cy="314" r="8"/>
    <circle cx="286" cy="336" r="8"/><circle cx="330" cy="336" r="8"/>
    <circle cx="308" cy="358" r="8"/>
  </g>
  <!-- sheen -->
  <ellipse cx="278" cy="274" rx="30" ry="20" fill="#ffffff" opacity="0.5"/>
</svg>
